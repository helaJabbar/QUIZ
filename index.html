<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>QCM HTML / CSS</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="LOGO.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka+One&display=swap"
      rel="stylesheet"
    />
    <script type="module">
        // 1️⃣ Importer Firebase + Firestore
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
      
        // 2️⃣ Configuration de TON projet (celle que tu m’as donnée)
        const firebaseConfig = {
          apiKey: "AIzaSyCsbA8hhJ0on0jTRlpYOJxLIKaEH76lqYw",
          authDomain: "quiz-e2db1.firebaseapp.com",
          projectId: "quiz-e2db1",
          storageBucket: "quiz-e2db1.firebasestorage.app",
          messagingSenderId: "266215235292",
          appId: "1:266215235292:web:dd4f66ac9ad993ed461e19"
        };
      
        // 3️⃣ Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
      
        // 👉 On rend db accessible partout dans ton JS
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
      </script>
      
  </head>
  <body>
    <header id="examHeader">
        <img src="LOGO.png" alt="Logo" id="logo">
        <h1>Concours Développement Web 2025-2026</h1>
        <div id="participantName"></div>
    </header>
    
    <div id="progressBar" ></div>
    
    <div class="quiz">
      <div id="userForm" class="quiz">
        <h2>Inscription</h2>
        <div class="form-group">
          <label for="lastName" >Nom :</label>
          <input type="text" id="lastName" placeholder="Entrez votre nom" />
        </div>
        <div class="form-group">
          <label for="firstName">Prénom :</label>
          <input type="text" id="firstName" placeholder="Entrez votre prénom" />
        </div>
        <div class="form-group">
          <label for="dob">Date de naissance :</label>
          <input type="date" id="dob" />
        </div>
        <button id="startBtn">Commencer le quiz</button>
      </div>
    
      <div id="quizContainer" style="display: none">
        <div class="quiz-header">
          <div class="progress" id="progress"></div>
          <div id="timer" style="float: right; font-weight: bold; color: #f49f20"></div>
        </div>
    
        <div class="question-container">
          <img src="engrenage.png" alt="illustration question" class="question-img" />
          <h2 id="question"></h2>
        </div>
    
        <div id="choices"></div>
    
        <div class="btn-container">
          <button id="prevBtn" class="btn">Précédent</button>
          <button id="nextBtn" class="btn">Suivant</button>
        </div>
      </div>
    </div>
    

    <footer>
    <img  id="mainFooter" src="footer.png" alt="">
    </footer>

    <script src="script.js" async></script>
  </body>
</html>
